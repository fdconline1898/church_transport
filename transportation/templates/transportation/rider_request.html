<!DOCTYPE html>
<html>
<head>
    <title>Request a Ride</title>
    <link rel="stylesheet" href="/static/transportation/styles.css">
</head>
<body>

<header class="header">
    <h1>Request a Ride</h1>
</header>

<form method="post" class="form">
    {% csrf_token %}

    <label>Full Name</label>
    <input type="text" name="full_name" required>

    <label>Phone Number</label>
    <input type="text" name="phone" required>

    <label>Address</label>
    <input type="text" name="address_line1" placeholder="Street Address" required>
    <div class="row">
        <input type="text" name="city" placeholder="City" required>
        <input type="text" name="state" placeholder="State" required>
        <input type="text" name="zip_code" placeholder="ZIP" required>
    </div>

    <label>Preferred Service Time</label>
    <input type="text" name="preferred_service_time" placeholder="e.g., Sunday 10:30 AM" required>

    <label class="checkbox">
        <input type="checkbox" name="recurring_weekly" checked>
        I need this ride every week
    </label>

    <button type="submit" class="button">Submit Request</button>
</form>

</body>
</html>
